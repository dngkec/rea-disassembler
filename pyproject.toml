[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-disassembler"
version = "1.1.0"
description = "Headless, evidence-first disassembler: Mach-O/ELF/PE, ARM64+x86-64, CFG/call-graph/string-xrefs/pseudocode, JSON-native"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["capstone==5.0.3"]
license = { text = "MIT" }

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["mcp>=1.2", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
readis = "rea_disassembler.cli:main"
readis-mcp = "rea_disassembler.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
